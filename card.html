<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Card Master Elite</title>

<link rel="stylesheet" href="card.css">

</head>


<body>


<div class="background-effect"></div>



<div class="game-container">


<header class="game-header">


<div class="logo">

<h1>
CARD MASTER
</h1>

<span>
ELITE
</span>

</div>



<div class="balance-box">

<span>موجودی</span>

<b>
🪙 <span id="coins">100000</span>
</b>

</div>


</header>





<section class="game-info">


<div class="info-box">

<span>
ورودی
</span>

<strong id="betView">
0
</strong>

</div>



<div class="info-box">

<span>
سود فعلی
</span>

<strong id="profit">
0
</strong>

</div>



<div class="info-box">

<span>
ضریب
</span>

<strong id="multi">
×1
</strong>

</div>


</section>







<section class="control-panel">


<div class="bet-area">


<input 
id="bet"
type="number"
placeholder="مبلغ بازی">


<button onclick="startGame()" class="start-btn">

شروع بازی

</button>


</div>





<div class="risk-panel">


<button onclick="setRisk('safe')">

امن

</button>


<button onclick="setRisk('normal')">

عادی

</button>


<button onclick="setRisk('hard')">

ریسکی

</button>


</div>



</section>







<section id="cards" class="cards-table">


</section>







<section class="action-panel">


<button 
id="cashout"
onclick="cashOut()"
disabled>

💰 برداشت سود

</button>



<button onclick="startGame()">

🔄 بازی دوباره

</button>


</section>







<div id="message" class="message-box">

آماده شروع بازی

</div>





</div>



<script src="card.js"></script>


</body>

</html>
