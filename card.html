<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Card Master PRO+</title>

<link rel="stylesheet" href="card.css">

</head>


<body>


<div class="game">


<header class="top">

<div>

<h1>🃏 CARD MASTER</h1>

<span>PRO+</span>

</div>


<div class="wallet">

🪙
<b id="coins">
0
</b>

</div>

</header>





<section class="dashboard">


<div>

<p>ورودی</p>

<strong id="betView">
0
</strong>

</div>



<div>

<p>سود</p>

<strong id="profit">
0
</strong>

</div>



<div>

<p>ضریب</p>

<strong id="multi">
×1</strong>

</div>



</section>







<section class="control">


<input id="bet" placeholder="مبلغ بازی">


<div class="risk">


<button onclick="setRisk('safe')">
امن
</button>


<button onclick="setRisk('normal')">
عادی
</button>


<button onclick="setRisk('hard')">
خطرناک
</button>


</div>



<button class="start" onclick="startGame()">

شروع بازی

</button>


</section>






<div id="table" class="table">


</div>






<div class="actions">


<button id="cashout" onclick="cashout()" disabled>

💰 برداشت سود

</button>


</div>





<div id="message" class="message">

آماده بازی

</div>




</div>



<script src="card.js"></script>

</body>

</html>
