<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Card Master Elite</title>

<link rel="stylesheet" href="card.css">

</head>


<body>


<div class="smoke"></div>


<div class="game">


<header class="header">


<div class="brand">

<h1>
CARD MASTER
</h1>

<span>
ELITE
</span>

</div>



<div class="wallet">

🪙

<b id="coins">
0
</b>

</div>


</header>





<section class="panel">


<div>

<label>
ورودی
</label>

<strong id="betView">
0
</strong>

</div>


<div>

<label>
سود
</label>

<strong id="profit">
0
</strong>

</div>


<div>

<label>
ضریب
</label>

<strong id="multi">
×1
</strong>

</div>


</section>







<section class="controls">


<input id="bet"
placeholder="مبلغ سکه">



<div class="buttons">


<button onclick="setRisk('safe')">
SAFE
</button>


<button onclick="setRisk('normal')">
NORMAL
</button>


<button onclick="setRisk('elite')">
ELITE
</button>


</div>




<button class="play" onclick="startGame()">

🎴 شروع بازی

</button>


</section>







<section id="cards" class="cards">


</section>






<section class="bottom">


<button id="cashout" onclick="cashOut()" disabled>

💰 برداشت سود

</button>


<button onclick="startGame()">

🔄 بازی دوباره

</button>


</section>







<div id="message" class="message">

آماده بازی

</div>



</div>




<script src="card.js"></script>

</body>

</html>
