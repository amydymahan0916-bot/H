<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Card Master PRO</title>

<link rel="stylesheet" href="card.css">

</head>


<body>


<div class="app">


<header>

<h1>🃏 CARD MASTER PRO</h1>


<div class="balance">
🪙
<span id="coins">0</span>
</div>

</header>




<section class="info">


<div>
مبلغ بازی
<b id="betShow">
0
</b>
</div>


<div>
سود فعلی
<b id="profit">
0
</b>
</div>


<div>
ضریب
<b id="multi">
×1
</b>
</div>


</section>





<section class="start-box">


<input id="bet" placeholder="مبلغ ورود">


<button onclick="startGame()">
شروع بازی
</button>


</section>






<div id="cards" class="cards">

</div>





<div class="actions">


<button id="cashout" onclick="cashOut()" disabled>

💰 برداشت سود

</button>


</div>





<div class="result" id="result">

آماده بازی

</div>




</div>



<script src="card.js"></script>

</body>

</html>
