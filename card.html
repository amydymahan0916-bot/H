<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Card Master PRO</title>

<link rel="stylesheet" href="card.css">

</head>


<body>


<div class="card-app">


<header>

<h1>
🃏 CARD MASTER
</h1>


<div class="money">

🪙
<span id="coins">
100000
</span>

</div>


</header>




<section class="setup">


<h2>
شروع بازی
</h2>


<input 
id="bet"
type="number"
placeholder="مبلغ ورود">



<div class="risk">


<button onclick="setRisk('low')">
کم
</button>


<button onclick="setRisk('mid')">
متوسط
</button>


<button onclick="setRisk('high')">
زیاد
</button>


</div>



<button class="start" onclick="startCard()">

شروع بازی

</button>



</section>






<div id="cards">

</div>





<div class="result" id="result">

منتظر شروع بازی

</div>




</div>



<script src="card.js"></script>

</body>

</html>
